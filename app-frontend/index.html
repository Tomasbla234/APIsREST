<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas API REST</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d6a8f 50%, #3fa796 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 16px;
            color: #1f2937;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        header {
            padding: 28px 32px 20px;
            border-bottom: 1px solid #eef1f4;
        }

        .etiqueta {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #2d6a8f;
            background: #e6f1f7;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        h1 { font-size: 26px; font-weight: 700; }

        .subtitulo {
            margin-top: 6px;
            font-size: 14px;
            color: #6b7280;
        }

        .estado {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
        }

        .punto {
            width: 9px; height: 9px; border-radius: 50%;
            background: #9ca3af;
        }
        .punto.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
        .punto.error { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.2); }

        .formulario {
            display: flex;
            gap: 10px;
            padding: 20px 32px;
            background: #f9fafb;
            border-bottom: 1px solid #eef1f4;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input[type="text"]:focus {
            border-color: #2d6a8f;
            box-shadow: 0 0 0 3px rgba(45,106,143,.15);
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: background .15s, transform .05s;
        }
        button:active { transform: scale(.97); }

        .btn-agregar {
            padding: 12px 18px;
            background: #2d6a8f;
            color: #fff;
        }
        .btn-agregar:hover { background: #1e3a5f; }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 32px;
            font-size: 13px;
            color: #6b7280;
        }

        .btn-vaciar {
            padding: 8px 14px;
            background: #fff;
            color: #dc2626;
            border: 1.5px solid #fecaca;
        }
        .btn-vaciar:hover { background: #fef2f2; }

        ul { list-style: none; padding: 0 20px 24px; }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 14px;
            margin: 0 12px 8px;
            background: #f9fafb;
            border: 1px solid #eef1f4;
            border-radius: 12px;
            font-size: 15px;
            animation: aparecer .2s ease-out;
        }
        li:hover { border-color: #cfe3ee; background: #f4f9fc; }

        .texto { display: flex; align-items: center; gap: 12px; word-break: break-word; }

        .numero {
            flex-shrink: 0;
            width: 26px; height: 26px;
            display: grid; place-items: center;
            font-size: 12px; font-weight: 700;
            color: #2d6a8f;
            background: #e6f1f7;
            border-radius: 50%;
        }

        .btn-eliminar {
            flex-shrink: 0;
            width: 32px; height: 32px;
            background: transparent;
            color: #9ca3af;
            font-size: 18px;
            line-height: 1;
        }
        .btn-eliminar:hover { background: #fee2e2; color: #dc2626; }

        .vacio {
            text-align: center;
            padding: 36px 20px 44px;
            color: #9ca3af;
            font-size: 15px;
        }
        .vacio span { display: block; font-size: 36px; margin-bottom: 8px; }

        footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            padding: 14px;
            border-top: 1px solid #eef1f4;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <main class="card">
        <header>
            <span class="etiqueta">Laboratorio #3 · Cloud Computing</span>
            <h1>Mi Gestor de Tareas</h1>
            <p class="subtitulo">Consumiendo una API REST (Express + Nginx + Docker Compose)</p>
            <div class="estado"><span id="punto" class="punto"></span><span id="estadoTexto">Conectando con la API...</span></div>
        </header>

        <div class="formulario">
            <input type="text" id="inputTarea" placeholder="Escribe una nueva tarea..." autocomplete="off">
            <button class="btn-agregar" onclick="agregarTarea()">Agregar Tarea</button>
        </div>

        <div class="barra">
            <span id="contador">0 tareas</span>
            <!-- RETO CALIFICABLE -->
            <button class="btn-vaciar" onclick="vaciarLista()">Vaciar Lista de Tareas</button>
        </div>

        <ul id="listaTareas"></ul>

        <footer>API: http://localhost:5000/api/tareas</footer>
    </main>

    <script>
        // Apuntamos al puerto expuesto de nuestra API
        const API_URL = 'http://localhost:5000/api/tareas';

        // Evita que el texto de una tarea se interprete como HTML
        function escapar(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function marcarEstado(ok) {
            document.getElementById('punto').className = 'punto ' + (ok ? 'ok' : 'error');
            document.getElementById('estadoTexto').textContent = ok
                ? 'API conectada en el puerto 5000'
                : 'No se pudo conectar con la API (¿está corriendo el backend?)';
        }

        // 1. CONSUMIR [GET]
        async function cargarTareas() {
            try {
                const respuesta = await fetch(API_URL);
                const tareas = await respuesta.json();
                marcarEstado(true);

                const lista = document.getElementById('listaTareas');
                lista.innerHTML = '';

                document.getElementById('contador').textContent =
                    tareas.length === 1 ? '1 tarea' : `${tareas.length} tareas`;

                if (tareas.length === 0) {
                    lista.innerHTML = '<li class="vacio" style="background:none;border:none;display:block"><span>📭</span>No hay tareas. ¡Agrega la primera!</li>';
                    return;
                }

                tareas.forEach((t, i) => {
                    lista.innerHTML += `<li>
                        <div class="texto"><span class="numero">${i + 1}</span>${escapar(t.texto)}</div>
                        <button class="btn-eliminar" title="Eliminar" onclick="eliminarTarea(${t.id})">✕</button>
                    </li>`;
                });
            } catch (e) {
                marcarEstado(false);
            }
        }

        // 2. CONSUMIR [POST]
        async function agregarTarea() {
            const input = document.getElementById('inputTarea');
            if (!input.value.trim()) return;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: input.value.trim() })
            });

            input.value = '';
            input.focus();
            cargarTareas(); // Refrescar la vista
        }

        // 3. CONSUMIR [DELETE]
        async function eliminarTarea(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            cargarTareas(); // Refrescar la vista
        }

        // 4. RETO CALIFICABLE: CONSUMIR [DELETE] global
        async function vaciarLista() {
            if (!confirm('¿Seguro que quieres vaciar toda la lista?')) return;
            await fetch(`${API_URL}/limpiar`, { method: 'DELETE' });
            cargarTareas(); // Refrescar la vista
        }

        // Agregar tarea también con la tecla Enter
        document.getElementById('inputTarea').addEventListener('keydown', e => {
            if (e.key === 'Enter') agregarTarea();
        });

        // Carga inicial
        cargarTareas();
    </script>
</body>
</html>
